name: Refresh Ask index

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the Worker after refreshing the R2 ask index as an optional cache reset
        required: true
        type: boolean
        default: false
  repository_dispatch:
    types:
      - sayit-updated
  schedule:
    # Backstop in case the upstream transcript dispatch is missed.
    - cron: "30 13 * * *"

permissions:
  contents: read

concurrency:
  group: refresh-ask-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Refresh R2 index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: askit-fuse-index-cache
          R2_KEY: ask-index/audrey-tang.json
        run: bun run build:index

      - name: Sync vector index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run vectorize:sync
      - name: Build bigram index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run index:bigram

      - name: Validate Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --dry-run --outdir /tmp/askit-hono-dry-run

      - name: Deploy Worker to refresh runtime cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
